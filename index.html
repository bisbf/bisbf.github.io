<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BISBF</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-hero">
      <div class="brand-lockup">
        <div>
          <img src="logo.png" alt="SCHLACHT.IO" class="site-logo" />
        </div>
      </div>
    </header>

    <nav class="nav-bar" aria-label="Primary">
      <div class="nav-inner">
        <button class="nav-item active" type="button">Forums</button>
        <button class="nav-item" type="button">Members</button>
        <button class="nav-item" type="button">Rules</button>
        <button class="nav-item" type="button">Updates</button>
        <div class="nav-spacer"></div>
        <label class="nav-search">
          <span aria-hidden="true">Search</span>
          <input id="searchInput" type="search" placeholder="Search" autocomplete="off" />
        </label>
        <button class="profile-button" id="profileButton" type="button" title="Your profile" hidden>
          <img class="profile-avatar" id="profileAvatar" alt="Your profile" />
          <span class="profile-name" id="profileName"></span>
        </button>
      </div>
    </nav>

    <main class="page-shell">
      <section class="main-column" aria-label="Forum index">
        <div class="action-row">
          <button class="new-post-button" id="newPostButton" type="button">New post</button>
        </div>

        <div id="forumSections" class="forum-sections"></div>

        <section class="thread-browser" id="threadBrowser" aria-label="Threads">
          <header class="panel-heading">
            <div>
              <h2 id="threadBrowserTitle">Latest Threads</h2>
              <p id="threadBrowserMeta">All visible discussions</p>
            </div>
            <span id="postCount">0 threads</span>
          </header>
          <div id="postList" class="thread-list"></div>
          <div id="emptyState" class="empty-state" hidden>
            <h3>No threads yet</h3>
            <p>Start a discussion.</p>
            <button class="secondary-button" type="button" data-open-composer>Write a post</button>
          </div>
        </section>

        <article class="thread-detail" id="postDetail" aria-label="Selected thread">
          <div class="thread-placeholder">
            <h2>Select a thread</h2>
            <p>Replies and full posts open here.</p>
          </div>
        </article>
      </section>

      <aside class="side-column" aria-label="Forum sidebar">
        <section class="side-panel">
          <h2>New Threads</h2>
          <div id="newThreads" class="new-thread-list"></div>
        </section>

        <section class="side-panel">
          <h2>Forum statistics</h2>
          <dl class="stats">
            <div>
              <dt>Threads:</dt>
              <dd id="statThreads">0</dd>
            </div>
            <div>
              <dt>Replies:</dt>
              <dd id="statReplies">0</dd>
            </div>
            <div>
              <dt>Categories:</dt>
              <dd>5</dd>
            </div>
            <div>
              <dt>Storage:</dt>
              <dd>forum.db</dd>
            </div>
          </dl>
        </section>
      </aside>
    </main>

    <dialog id="composer" class="modal">
      <form method="dialog" class="modal-body" id="postForm">
        <div class="modal-header">
          <h2>New Post</h2>
          <button class="icon-button" value="cancel" aria-label="Close" type="button" id="closeComposer">x</button>
        </div>

        <label>
          <span>Your name</span>
          <input name="author" maxlength="60" placeholder="Name or nickname" autocomplete="name" />
        </label>

        <label>
          <span>Category</span>
          <select name="category" id="categorySelect"></select>
        </label>

        <label>
          <span>Title</span>
          <input name="title" maxlength="120" required placeholder="What is this about?" />
        </label>

        <label>
          <span>Post</span>
          <textarea name="body" rows="8" maxlength="5000" placeholder="Write the full post"></textarea>
        </label>

        <label>
          <span>Picture</span>
          <input name="image" type="file" accept="image/png,image/jpeg,image/webp,image/gif" />
        </label>
        <img id="postImagePreview" class="image-preview" alt="" hidden />

        <p class="error" id="postError" hidden></p>
        <div class="modal-actions">
          <button class="secondary-button" value="cancel" type="button" id="cancelComposer">Cancel</button>
          <button class="primary-button" type="submit">Publish</button>
        </div>
      </form>
    </dialog>

    <dialog id="profileEditor" class="modal">
      <form method="dialog" class="modal-body" id="profileForm">
        <div class="modal-header">
          <h2>Your Profile</h2>
          <button class="icon-button" value="cancel" aria-label="Close" type="button" id="closeProfile">x</button>
        </div>

        <label>
          <span>Name</span>
          <input id="profileInputName" name="profileName" maxlength="60" placeholder="Your name" />
        </label>

        <label>
          <span>Avatar</span>
          <div class="profile-avatar-options">
            <button type="button" class="secondary-button" id="profileFromGiphy">Search Giphy</button>
            <input id="profileImageUpload" name="profileImage" type="file" accept="image/*" />
          </div>
          <img id="profilePreview" class="image-preview profile-preview" alt="" hidden />
        </label>

        <label>
          <span>Profile Frame</span>
          <div class="profile-frames">
            <button type="button" class="frame-option" data-frame="glow" title="Glowy">✨</button>
            <button type="button" class="frame-option" data-frame="diamond" title="Diamond">💎</button>
            <button type="button" class="frame-option" data-frame="fire" title="Fire">🔥</button>
            <button type="button" class="frame-option" data-frame="star" title="Star">⭐</button>
          </div>
        </label>

        <label>
          <span>Name Animation</span>
          <select id="profileNameAnimation">
            <option value="none">None</option>
            <option value="glow">Glowing</option>
            <option value="rainbow">Rainbow</option>
            <option value="wave">Wave</option>
          </select>
        </label>

        <label>
          <span>Glow Color</span>
          <input id="profileGlowColor" type="color" value="#ff00ff" />
        </label>

        <p class="error" id="profileError" hidden></p>
        <div class="modal-actions">
          <button class="secondary-button" value="cancel" type="button" id="cancelProfile">Cancel</button>
          <button class="primary-button" type="submit">Save Profile</button>
        </div>
      </form>
    </dialog>

    <dialog id="giphySearch" class="modal">
      <div class="modal-body">
        <div class="modal-header">
          <h2>Search Giphy</h2>
          <button class="icon-button" value="cancel" aria-label="Close" type="button" id="closeGiphy">x</button>
        </div>
        <input id="giphySearchInput" type="text" placeholder="Search for GIFs..." maxlength="100" />
        <div id="giphyResults" class="giphy-results"></div>
      </div>
    </dialog>

    <div id="notificationToast" class="notification-toast" hidden>
      <span id="notificationMessage"></span>
    </div>

    <script src="app.js"></script>
